name: Verify chain evidence packets
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # On main each revision gets its own group, so a newer push can neither
  # cancel a running main verification nor displace a pending one; GitHub
  # keeps only one pending run per group regardless of cancel-in-progress.
  # Other refs share one group per ref and cancel superseded runs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  packets:
    name: chain-packets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The 2026-10-29 chain family ships 103 verifiers, each replaying one
      # packet's receipts against the three captured program images. No
      # workflow ran them, so a packet could drift from its own evidence and
      # stay green. Pin the exact count: a packet that disappears is a hard
      # failure, and a new one is added here deliberately.
      EXPECTED_PACKETS: '103'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the receipt parser
        run: python -m pip install --disable-pip-version-check solders==0.27.1
      - name: Run every chain verifier
        run: |
          set -u
          files=$(ls -1 research/*-chains-20261029/verify.py research/amm-multi-hop-split-boost-tf-state-transitions-20261029/verify.py)
          count=$(printf '%s\n' "$files" | wc -l | tr -d ' ')
          if [ "$count" != "$EXPECTED_PACKETS" ]; then
            echo "::error::found $count chain verifiers, expected $EXPECTED_PACKETS"
            exit 1
          fi
          failed=0
          for f in $files; do
            if python -I -B "$f"; then
              echo "::notice::PASS $f"
            else
              echo "::error::FAIL $f"
              failed=$((failed + 1))
            fi
          done
          echo "verified $((count - failed)) of $count packets"
          test "$failed" -eq 0
