name: Verify captured evidence
on: [push, pull_request, workflow_dispatch]
concurrency:
  # On main each revision gets its own group, so a newer push can neither
  # cancel a running main verification nor displace a pending one; GitHub
  # keeps only one pending run per group regardless of cancel-in-progress.
  # Other refs share one group per ref and cancel superseded runs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - suite: composition-patch-bytes
            commands: |
              python -B reconstruction/harness/test_integrate_failures.py
              python -I -B tests/test_integrate_patch_bytes.py
          - suite: evidence
            commands: |
              python -B research/tooling-relocated-data-pointers-20261030/test_pointer_analysis.py
              python scripts/verify_evidence.py
              python scripts/test_tooling.py
              python -B reconstruction/harness/test_treediff_line_boundaries.py
              python -B reconstruction/harness/test_score_inputs.py
              python scripts/test_build_source_manifest.py
              python scripts/test_core_linux_v144_retention.py
              # Two of three tests: the third compares against a frozen helper that was removed with repro/;
              # see .github/retired-workflows/2026-10-29-verify-matrix.md.
              python scripts/test_reconstruction_build_selection.py ResearchSelectionTests.test_default_does_not_select_header_incompatible_older_family ResearchSelectionTests.test_explicit_experiment_and_argument_boundaries_are_preserved
              python scripts/test_reconstruction_identity_audit.py
              python scripts/local_validation.py
          - suite: host-fragments
            commands: |
              python -B tests/test_recovered_curve_arithmetic.py
              mkdir -p work && rustc --edition 2021 -O programs/pump-fees/recovered/fee_selection_host.rs -o work/fee-selector-host
              python scripts/validate_fee_selection.py --host work/fee-selector-host --output work/fee-selector-validation.json
              python scripts/build_quote_host.py --output work/quote-host
              python scripts/validate_quote_fees.py --host work/quote-host/quote-fees-host --output work/quote-validation.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: mkdir -p work
      - name: Run bounded validation suites
        run: ${{ matrix.commands }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.suite }}
          path: |
            work/*.json
            work/*.json.gz
          if-no-files-found: ignore

